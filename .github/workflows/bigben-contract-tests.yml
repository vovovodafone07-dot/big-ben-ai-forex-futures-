name: Big Ben API contract tests
on:
  push:
    branches: [main]
    paths:
      - "platform/backend/**"
      - "platform/tests/**"
      - ".github/workflows/bigben-contract-tests.yml"
  pull_request:
    paths:
      - "platform/backend/**"
      - "platform/tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r platform/backend/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q platform/backend platform/tests
      - name: Run webhook contract tests
        run: python -m unittest discover -s platform/tests -p "test_*.py" -v
