name: Big Ben continuation validation
on:
  pull_request:
  push:
    branches: ['feature/autonomous-continuation-2026-11-13']
permissions:
  contents: read
concurrency:
  group: continuation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install tzdata==2026.6
      - run: python -m unittest discover -s platform/tests -v
      - run: python -m unittest discover -s research/tests -v
      - run: python scripts/check_frontend.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bigben_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r platform/backend/requirements.txt
      - run: python scripts/check_postgres.py
        env:
          BIGBEN_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/bigben_ci
