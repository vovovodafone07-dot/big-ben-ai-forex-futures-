name: Big Ben Daily Research (read-only)
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/daily-research.yml'
concurrency:
  group: bigben-daily-research
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  research:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research engine and data adapter
        run: python -m unittest discover -s research/tests -v
      - name: Research with licensed Barchart feed when configured
        env:
          BARCHART_API_KEY: ${{ github.event_name == 'schedule' && secrets.BARCHART_API_KEY || github.event_name == 'workflow_dispatch' && secrets.BARCHART_API_KEY || '' }}
          BIGBEN_BARCHART_SYMBOL_MAP: ${{ vars.BIGBEN_BARCHART_SYMBOL_MAP }}
        shell: bash
        run: |
          mkdir -p research/reports
          if [ -f research/data/market_m5.csv ] && [ -z "$BARCHART_API_KEY" ]; then
            python research/daily_agents.py research/data/market_m5.csv > research/reports/latest.json
          else
            python research/run_provider_research.py
          fi
      - name: Save research evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigben-daily-research
          path: research/reports/latest.json
          retention-days: 30
