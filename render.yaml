services:
  - type: web
    name: bigben-ai-pro-api
    runtime: python
    plan: free
    buildCommand: "python -m pip install -r platform/backend/requirements.txt && python -m compileall -q platform/backend"
    startCommand: "python platform/backend/app.py"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BIGBEN_DASHBOARD_PASSWORD
        sync: false
      - key: BIGBEN_WEBHOOK_TOKEN
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BIGBEN_DAILY_TELEGRAM_ENABLED
        value: "1"
      - key: BIGBEN_SIGNAL_ANALYSIS_ENABLED
        value: "1"
      - key: BIGBEN_AGENT_WATCHDOG_ENABLED
        value: "1"
      - key: BIGBEN_WHATSAPP_ENABLED
        value: "0"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
